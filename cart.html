<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | DST RAWANA LANKA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fffaf3;
    color:#4b2a18;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:9999;

    background:white;

    box-shadow:
    0 3px 15px rgba(75,42,24,.10);
}

.navbar{
    max-width:1400px;
    margin:auto;
    min-height:100px;
    padding:18px 40px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}


/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
}

.logo-box{
    width:58px;
    height:58px;

    background:#4b2a18;
    color:white;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    font-weight:900;
}

.logo-text{
    line-height:.9;
}

.dst{
    display:block;
    font-size:20px;
    font-weight:900;
    color:#3d2416;
    letter-spacing:1px;
}

.rawana{
    font-size:22px;
    font-weight:900;
    color:#a66b2f;
    letter-spacing:1px;
}

.lanka{
    font-size:22px;
    font-weight:900;
    color:#3d2416;
    margin-left:5px;
    letter-spacing:1px;
}


/* NAV */

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    list-style:none;
}

.nav-links a{
    text-decoration:none;
    color:#4b2a18;
    font-size:15px;
    font-weight:700;
}

.nav-links a:hover{
    color:#a66b2f;
}

.cart-button{
    background:#4b2a18;
    color:white !important;
    padding:13px 23px;
    border-radius:30px;
}


/* CART SECTION */

.cart-section{
    min-height:calc(100vh - 100px);
    padding:80px 20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:45px;
}

.label{
    color:#a66b2f;
    font-size:14px;
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:12px;
}

.title h1{
    font-family:Georgia,serif;
    font-size:50px;
    color:#4b2a18;
}

.title p{
    color:#876d5b;
    margin-top:10px;
}


/* CART ITEMS */

.cart-box{
    background:white;
    border:1px solid #eedfce;
    border-radius:25px;
    padding:30px;

    box-shadow:
    0 15px 40px rgba(75,42,24,.10);
}

.cart-item{

    display:flex;
    align-items:center;
    gap:20px;

    padding:20px 0;

    border-bottom:1px solid #eedfce;
}

.cart-item:last-child{
    border-bottom:none;
}

.cart-image{
    width:100px;
    height:100px;

    object-fit:cover;

    border-radius:15px;

    background:#f3e5d4;
}

.item-info{
    flex:1;
}

.item-info h3{
    font-family:Georgia,serif;
    font-size:22px;
    margin-bottom:7px;
}

.item-price{
    color:#a66b2f;
    font-weight:900;
    font-size:18px;
}


/* QUANTITY */

.quantity-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity-box button{

    width:35px;
    height:35px;

    border:none;

    background:#4b2a18;
    color:white;

    border-radius:50%;

    cursor:pointer;

    font-size:18px;
    font-weight:bold;
}

.quantity-box span{
    min-width:25px;
    text-align:center;
    font-weight:900;
}


/* REMOVE */

.remove-btn{

    border:none;

    background:#f3e5d4;

    color:#4b2a18;

    padding:10px 15px;

    border-radius:20px;

    cursor:pointer;

    font-weight:800;
}

.remove-btn:hover{
    background:#ead2b9;
}


/* TOTAL */

.cart-bottom{

    margin-top:30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:20px;

    flex-wrap:wrap;
}

.total{
    font-size:27px;
    font-weight:900;
}

.total span{
    color:#a66b2f;
}


/* BUTTONS */

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;

    text-decoration:none;

    padding:14px 25px;

    border-radius:30px;

    font-weight:900;

    border:none;

    cursor:pointer;
}

.continue-btn{
    background:#f1c58d;
    color:#4b2a18;
}

.order-btn{
    background:#4b2a18;
    color:white;
}

.clear-btn{
    background:#ead8c5;
    color:#4b2a18;
}


/* EMPTY */

.empty-cart{
    text-align:center;
    padding:50px 20px;
}

.empty-cart .icon{
    font-size:60px;
    margin-bottom:15px;
}

.empty-cart h2{
    font-family:Georgia,serif;
    margin-bottom:10px;
}

.empty-cart p{
    color:#876d5b;
    margin-bottom:25px;
}


/* FOOTER */

footer{
    background:#29160d;
    color:white;
    text-align:center;
    padding:30px 20px;
}

footer p{
    color:#cbb8a7;
}


/* MOBILE */

@media(max-width:750px){

    .navbar{
        flex-direction:column;
        gap:20px;
        padding:20px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:13px;
    }

    .cart-section{
        padding:50px 15px;
    }

    .cart-box{
        padding:20px;
    }

    .cart-item{
        flex-wrap:wrap;
    }

    .item-info{
        min-width:calc(100% - 130px);
    }

    .cart-bottom{
        flex-direction:column;
        align-items:stretch;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        text-align:center;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<nav class="navbar">

<a href="index.html" class="logo">

<div class="logo-box">
D
</div>

<div class="logo-text">

<span class="dst">DST</span>
<span class="rawana">RAWANA</span>
<span class="lanka">LANKA</span>

</div>

</a>


<ul class="nav-links">

<li>
<a href="index.html">Home</a>
</li>

<li>
<a href="products.html">Products</a>
</li>

<li>
<a href="about.html">About</a>
</li>

<li>
<a href="order.html">Order</a>
</li>

<li>
<a href="cart.html" class="cart-button">
🛒 Cart <span id="cartCount">0</span>
</a>
</li>

</ul>

</nav>

</header>



<!-- CART -->

<section class="cart-section">

<div class="container">


<div class="title">

<div class="label">
DST RAWANA LANKA
</div>

<h1>
Your Cart
</h1>

<p>
Review your selected products
</p>

</div>



<div class="cart-box">

<div id="cartItems"></div>


<div class="cart-bottom">

<div class="total">
Total:
<span id="total">
Rs. 0.00
</span>
</div>


<div class="buttons">

<a
href="products.html"
class="btn continue-btn">

← Continue Shopping

</a>

<button
class="btn clear-btn"
onclick="clearCart()">

Clear Cart

</button>

<a
href="order.html"
class="btn order-btn">

📦 Place Order

</a>

</div>

</div>

</div>

</div>

</section>



<footer>

<p>
© 2026 DST RAWANA LANKA. All Rights Reserved.
</p>

</footer>



<script>


/* LOAD CART */

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];


/* ELEMENTS */

const cartItems =
document.getElementById("cartItems");

const total =
document.getElementById("total");

const cartCount =
document.getElementById("cartCount");


/* SHOW CART */

function showCart(){

    cartItems.innerHTML = "";

    let sum = 0;

    let count = 0;


    /* EMPTY */

    if(cart.length === 0){

        cartItems.innerHTML = `

        <div class="empty-cart">

            <div class="icon">
                🛒
            </div>

            <h2>
                Your Cart is Empty
            </h2>

            <p>
                Add some delicious products
                to your cart.
            </p>

            <a
            href="products.html"
            class="btn order-btn">

                View Products

            </a>

        </div>

        `;

        total.innerText =
        "Rs. 0.00";

        cartCount.innerText =
        "0";

        return;
    }


    /* ITEMS */

    cart.forEach(
        (item,index) => {

            const quantity =
            Number(item.quantity) || 1;

            const price =
            Number(item.price) || 0;

            const itemTotal =
            price * quantity;


            sum += itemTotal;

            count += quantity;


            cartItems.innerHTML += `

            <div class="cart-item">

                <img
                src="${item.image}"
                class="cart-image"
                alt="${item.name}"
                >

                <div class="item-info">

                    <h3>
                    ${item.name}
                    </h3>

                    <div class="item-price">

                    Rs. ${price.toFixed(2)}

                    </div>

                </div>


                <div class="quantity-box">

                    <button
                    onclick="changeQty(${index},-1)">
                    −
                    </button>

                    <span>
                    ${quantity}
                    </span>

                    <button
                    onclick="changeQty(${index},1)">
                    +
                    </button>

                </div>


                <strong>
                Rs. ${itemTotal.toFixed(2)}
                </strong>


                <button
                class="remove-btn"
                onclick="removeItem(${index})">

                Remove

                </button>

            </div>

            `;

        }
    );


    total.innerText =
    "Rs. " +
    sum.toFixed(2);


    cartCount.innerText =
    count;

}


/* CHANGE QUANTITY */

function changeQty(index,change){

    cart[index].quantity += change;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

}


/* REMOVE */

function removeItem(index){

    cart.splice(index,1);

    saveCart();

}


/* CLEAR */

function clearCart(){

    if(cart.length === 0){
        return;
    }

    if(
        confirm(
        "Are you sure you want to clear your cart?"
        )
    ){

        cart = [];

        saveCart();

    }

}


/* SAVE */

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    showCart();

}


/* START */

showCart();

</script>


</body>

</html>
