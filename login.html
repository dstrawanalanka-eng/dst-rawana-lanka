<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | DST RAWANA LANKA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Arial, Helvetica, sans-serif;

    background:
    linear-gradient(
        rgba(63,36,21,0.65),
        rgba(63,36,21,0.65)
    ),
    url("images/hero.jpg");

    background-size:cover;
    background-position:center;
}

.login-box{

    width:420px;
    max-width:90%;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.25);
}

.logo{

    text-align:center;

    margin-bottom:10px;

    font-family:Georgia,serif;

    font-size:30px;

    font-weight:900;

    color:#4b2a18;
}

.subtitle{

    text-align:center;

    color:#927c6b;

    margin-bottom:30px;
}

label{

    display:block;

    margin-bottom:7px;

    color:#4b2a18;

    font-weight:700;
}

input{

    width:100%;

    padding:14px;

    border:1px solid #dfcdbb;

    border-radius:12px;

    outline:none;

    font-size:15px;

    margin-bottom:20px;
}

input:focus{

    border-color:#a66b2f;

    box-shadow:
    0 0 0 3px rgba(166,107,47,0.12);
}

.login-btn{

    width:100%;

    border:none;

    padding:15px;

    border-radius:25px;

    background:#4b2a18;

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:0.3s;
}

.login-btn:hover{

    background:#2f190d;

    transform:translateY(-2px);
}

.login-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

    transform:none;
}

.message{

    text-align:center;

    margin-top:18px;

    font-size:14px;

    min-height:20px;
}

.signup-link{

    text-align:center;

    margin-top:25px;

    color:#705b4b;
}

.signup-link a{

    color:#a66b2f;

    font-weight:800;

    text-decoration:none;
}

.back-home{

    display:block;

    text-align:center;

    margin-top:18px;

    color:#927c6b;

    text-decoration:none;

    font-size:14px;
}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">

DST RAWANA LANKA

</div>


<div class="subtitle">

Welcome back! Please login.

</div>


<form id="loginForm">


<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>


<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>


<button
type="submit"
class="login-btn"
id="loginBtn">

🔐 Login

</button>


</form>


<div
class="message"
id="message">
</div>


<div class="signup-link">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>


<a
href="index.html"
class="back-home">

← Back to Home

</a>


</div>


<script type="module">

import {

    auth,

    signInWithEmailAndPassword

} from "./js/auth.js";


const form =
document.getElementById(
    "loginForm"
);


const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const message =
document.getElementById(
    "message"
);


const loginBtn =
document.getElementById(
    "loginBtn"
);


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        message.innerText = "";


        loginBtn.disabled = true;

        loginBtn.innerText =
        "Logging in...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.innerText =
            "✅ Login successful!";


            message.style.color =
            "#287a3d";


            setTimeout(function(){

                window.location.href =
                "index.html";

            },1000);


        }

        catch(error){

            console.error(error);


            let errorMessage =
            "❌ Login failed.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                errorMessage =
                "❌ Incorrect email or password.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                errorMessage =
                "❌ Account not found.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                errorMessage =
                "❌ Incorrect password.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                errorMessage =
                "❌ Please enter a valid email.";

            }


            message.innerText =
            errorMessage;


            message.style.color =
            "#c0392b";


            loginBtn.disabled = false;

            loginBtn.innerText =
            "🔐 Login";

        }

    }
);

</script>


</body>

</html>
