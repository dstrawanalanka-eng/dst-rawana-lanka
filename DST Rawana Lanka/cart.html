<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DST RAWANA LANKA | Shopping Cart</title>

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fffaf3;
    color:#3d281c;
    min-height:100vh;
}


/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    background:rgba(255,255,255,.97);

    backdrop-filter:blur(15px);

    box-shadow:0 3px 20px rgba(0,0,0,.08);
}

.navbar{
    max-width:1250px;
    height:80px;

    margin:auto;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-mark{
    width:48px;
    height:48px;

    background:#4b2c1a;
    color:white;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    font-weight:900;

    box-shadow:0 6px 18px rgba(75,44,26,.25);
}

.logo-text{
    color:#4b2c1a;

    font-size:18px;
    font-weight:900;

    letter-spacing:1px;
    line-height:1.1;
}

.logo-text span{
    color:#ae7135;
}

.back-btn{
    text-decoration:none;

    background:#4b2c1a;
    color:white;

    padding:12px 20px;

    border-radius:30px;

    font-weight:bold;

    transition:.3s;
}

.back-btn:hover{
    background:#ae7135;
    transform:translateY(-2px);
}


/* ================= CART PAGE ================= */

.cart-page{
    padding:130px 6% 80px;
}

.cart-title{
    text-align:center;
    margin-bottom:45px;
}

.small-title{
    color:#a7662e;

    font-size:13px;
    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:12px;
}

.cart-title h1{
    font-family:Georgia,serif;

    color:#4b2c1a;

    font-size:48px;
}

.cart-container{
    max-width:1100px;
    margin:auto;
}


/* ================= CART ITEM ================= */

.cart-item{
    background:white;

    border:1px solid #efdfce;

    border-radius:20px;

    padding:18px;

    margin-bottom:18px;

    display:flex;

    align-items:center;

    gap:20px;

    box-shadow:0 8px 25px rgba(80,45,20,.07);
}

.cart-image{
    width:110px;
    height:110px;

    border-radius:16px;

    overflow:hidden;

    flex-shrink:0;

    background:#f1e4d5;
}

.cart-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.cart-details{
    flex:1;
}

.cart-details h3{
    font-family:Georgia,serif;

    color:#4b2c1a;

    font-size:21px;

    margin-bottom:8px;
}

.cart-price{
    color:#a7662e;

    font-weight:bold;

    font-size:17px;
}


/* ================= QUANTITY ================= */

.quantity-area{
    display:flex;

    align-items:center;

    gap:10px;
}

.quantity-btn{
    width:38px;
    height:38px;

    border:none;

    border-radius:10px;

    background:#4b2c1a;

    color:white;

    cursor:pointer;

    font-size:20px;

    font-weight:bold;
}

.quantity-btn:hover{
    background:#ae7135;
}

.quantity{
    min-width:30px;

    text-align:center;

    font-size:17px;

    font-weight:bold;
}


/* ================= ITEM TOTAL ================= */

.item-total{
    width:140px;

    text-align:right;

    color:#4b2c1a;

    font-size:18px;

    font-weight:bold;
}


/* ================= REMOVE ================= */

.remove-btn{
    border:none;

    background:#f3e3cf;

    color:#7b4426;

    padding:10px 14px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;
}

.remove-btn:hover{
    background:#7b4426;
    color:white;
}


/* ================= EMPTY CART ================= */

.empty-cart{
    background:white;

    border:1px solid #efdfce;

    border-radius:25px;

    padding:70px 20px;

    text-align:center;

    box-shadow:0 8px 25px rgba(80,45,20,.07);
}

.empty-icon{
    font-size:65px;
    margin-bottom:20px;
}

.empty-cart h2{
    font-family:Georgia,serif;

    color:#4b2c1a;

    margin-bottom:10px;
}

.empty-cart p{
    color:#897467;

    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;

    text-decoration:none;

    background:#4b2c1a;

    color:white;

    padding:13px 25px;

    border-radius:30px;

    font-weight:bold;
}

.shop-btn:hover{
    background:#ae7135;
}


/* ================= SUMMARY ================= */

.cart-summary{
    max-width:500px;

    margin:35px 0 0 auto;

    background:#f3e3cf;

    border-radius:25px;

    padding:28px;
}

.summary-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;

    color:#735c4d;
}

.summary-row.total{
    border-top:1px solid rgba(75,44,26,.2);

    padding-top:18px;

    margin-top:15px;

    color:#4b2c1a;

    font-size:24px;

    font-weight:bold;
}

.checkout-btn{
    width:100%;

    border:none;

    background:#4b2c1a;

    color:white;

    padding:15px;

    border-radius:30px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

    transition:.3s;
}

.checkout-btn:hover{
    background:#ae7135;

    transform:translateY(-2px);
}


/* ================= CHECKOUT ================= */

.checkout-section{
    display:none;

    max-width:700px;

    margin:35px auto 0;

    background:white;

    border:1px solid #efdfce;

    border-radius:25px;

    padding:30px;

    box-shadow:0 8px 25px rgba(80,45,20,.07);
}

.checkout-section h2{
    font-family:Georgia,serif;

    color:#4b2c1a;

    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    color:#4b382d;

    font-weight:bold;

    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    border:1px solid #dfcdbb;

    background:#fffaf5;

    border-radius:12px;

    padding:13px;

    font-size:15px;

    outline:none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#ae7135;
}

.form-group textarea{
    min-height:100px;

    resize:vertical;
}


/* ================= WHATSAPP ================= */

.place-order-btn{
    width:100%;

    border:none;

    background:#25D366;

    color:white;

    padding:15px;

    border-radius:30px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:8px;

    transition:.3s;
}

.place-order-btn:hover{
    background:#1da851;

    transform:translateY(-2px);
}


/* ================= MESSAGE ================= */

.message{
    position:fixed;

    right:25px;
    bottom:25px;

    z-index:9999;

    background:#4b2c1a;

    color:white;

    padding:14px 22px;

    border-radius:30px;

    font-weight:bold;

    box-shadow:0 10px 30px rgba(0,0,0,.25);
}


/* ================= FOOTER ================= */

footer{
    margin-top:70px;

    background:#321d12;

    color:white;

    padding:45px 7%;

    text-align:center;
}

.footer-brand{
    font-size:23px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:12px;
}

.footer-brand span{
    color:#d49a59;
}

footer p{
    color:#cdbdb0;

    font-size:14px;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .navbar{
        height:70px;

        padding:0 15px;
    }

    .logo-mark{
        width:42px;
        height:42px;

        font-size:18px;
    }

    .logo-text{
        font-size:14px;
    }

    .back-btn{
        padding:10px 14px;

        font-size:12px;
    }

    .cart-page{
        padding:105px 15px 60px;
    }

    .cart-title h1{
        font-size:38px;
    }

    .cart-item{
        flex-wrap:wrap;

        padding:15px;
    }

    .cart-image{
        width:85px;
        height:85px;
    }

    .cart-details{
        min-width:calc(100% - 120px);
    }

    .quantity-area{
        margin-left:105px;
    }

    .item-total{
        width:auto;

        margin-left:auto;
    }

    .remove-btn{
        margin-left:auto;
    }

    .cart-summary{
        margin-top:25px;
    }

    .checkout-section{
        padding:22px;
    }

}


/* ================= SMALL MOBILE ================= */

@media(max-width:450px){

    .cart-item{
        gap:12px;
    }

    .quantity-area{
        margin-left:0;
    }

    .item-total{
        width:100%;

        text-align:left;

        margin-left:0;
    }

    .remove-btn{
        margin-left:0;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

<nav class="navbar">

    <div class="logo">

        <div class="logo-mark">
            D
        </div>

        <div class="logo-text">

            DST <span>RAWANA</span><br>
            LANKA

        </div>

    </div>


    <a
        href="index.html"
        class="back-btn">

        ← Continue Shopping

    </a>

</nav>

</header>



<!-- ================= MAIN CART ================= -->

<main class="cart-page">


    <div class="cart-title">

        <div class="small-title">
            Your Shopping Cart
        </div>

        <h1>
            My Cart 🛒
        </h1>

    </div>


    <div class="cart-container">


        <!-- CART ITEMS -->

        <div id="cartItems"></div>


        <!-- SUMMARY -->

        <div
            class="cart-summary"
            id="cartSummary">

            <div class="summary-row">

                <span>
                    Total Items
                </span>

                <strong id="itemCount">
                    0
                </strong>

            </div>


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <span id="total">
                    Rs. 0.00
                </span>

            </div>


            <button
                class="checkout-btn"
                onclick="showCheckout()">

                Proceed to Order

            </button>

        </div>



        <!-- ================= CHECKOUT ================= -->

        <div
            class="checkout-section"
            id="checkoutSection">

            <h2>
                📝 Order Details
            </h2>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name">

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="customerPhone"
                    placeholder="Enter your phone number">

            </div>


            <div class="form-group">

                <label>
                    Delivery Location
                </label>

                <input
                    type="text"
                    id="customerLocation"
                    placeholder="Enter your city / town">

            </div>


            <div class="form-group">

                <label>
                    Delivery Address
                </label>

                <textarea
                    id="customerAddress"
                    placeholder="Enter your full delivery address"></textarea>

            </div>


            <div class="form-group">

                <label>
                    Payment Method
                </label>

                <select id="paymentMethod">

                    <option value="Cash on Delivery">
                        Cash on Delivery
                    </option>

                </select>

            </div>


            <button
                class="place-order-btn"
                onclick="placeOrder()">

                📱 Place Order via WhatsApp

            </button>

        </div>


    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer>

    <div class="footer-brand">

        DST <span>RAWANA LANKA</span>

    </div>

    <p>

        © 2026 DST RAWANA LANKA.
        All Rights Reserved.

    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>


/* ==========================================
   LOAD CART
========================================== */

let cart = [];


function loadCart(){

    try{

        const savedCart =
            localStorage.getItem("cart");

        if(savedCart){

            cart = JSON.parse(savedCart);

        }else{

            cart = [];

        }


        if(!Array.isArray(cart)){

            cart = [];

        }


        /* Fix old / invalid quantities */

        cart.forEach(function(item){

            item.price =
                Number(item.price) || 0;

            item.quantity =
                Number(item.quantity) || 1;

        });


    }catch(error){

        console.log("Cart loading error:",error);

        cart = [];

    }

}



/* ==========================================
   PRODUCT IMAGES
========================================== */

const productImages = {

    "Yoghurt":
        "images/product1.jpg",

    "Fruit Drink":
        "images/product2.jpg",

    "Butter":
        "images/product3.jpg",

    "Ghee":
        "images/product4.jpg",

    "Jelly Yoghurt":
        "images/product5.jpg",

    "Aloe Vera Drink":
        "images/product6.jpg",

    "Passion Drink":
        "images/product7.jpg",

    "Mango Fruit Drink":
        "images/product8.jpg",

    "Lime Drink":
        "images/product9.jpg",

    "Mix Fruit Drink":
        "images/product10.jpg"

};



/* ==========================================
   SAVE CART
========================================== */

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}



/* ==========================================
   SHOW CART
========================================== */

function showCart(){

    const cartItems =
        document.getElementById("cartItems");

    const cartSummary =
        document.getElementById("cartSummary");

    const checkoutSection =
        document.getElementById("checkoutSection");


    cartItems.innerHTML = "";


    /* EMPTY */

    if(cart.length === 0){

        cartItems.innerHTML = `

            <div class="empty-cart">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    You haven't added any products yet.
                </p>

                <a
                    href="index.html#products"
                    class="shop-btn">

                    Shop Products

                </a>

            </div>

        `;


        cartSummary.style.display = "none";

        checkoutSection.style.display = "none";

        return;

    }


    cartSummary.style.display = "block";


    let totalAmount = 0;

    let totalItems = 0;



    /* ======================================
       CREATE CART ITEMS
    ====================================== */

    cart.forEach(function(item,index){


        const price =
            Number(item.price) || 0;


        const quantity =
            Number(item.quantity) || 1;


        const itemTotal =
            price * quantity;


        totalAmount += itemTotal;

        totalItems += quantity;


        const image =
            productImages[item.name]
            || "images/hero.jpg";


        const itemElement =
            document.createElement("div");


        itemElement.className =
            "cart-item";


        itemElement.innerHTML = `

            <div class="cart-image">

                <img
                    src="${image}"
                    alt="${item.name}">

            </div>


            <div class="cart-details">

                <h3>
                    ${item.name}
                </h3>

                <div class="cart-price">

                    Rs. ${price.toFixed(2)}

                </div>

            </div>


            <div class="quantity-area">

                <button
                    class="quantity-btn"
                    onclick="decreaseQuantity(${index})">

                    −

                </button>


                <span class="quantity">

                    ${quantity}

                </span>


                <button
                    class="quantity-btn"
                    onclick="increaseQuantity(${index})">

                    +

                </button>

            </div>


            <div class="item-total">

                Rs. ${itemTotal.toFixed(2)}

            </div>


            <button
                class="remove-btn"
                onclick="removeItem(${index})">

                Remove

            </button>

        `;


        cartItems.appendChild(itemElement);

    });


    document.getElementById(
        "itemCount"
    ).textContent = totalItems;


    document.getElementById(
        "total"
    ).textContent =
        "Rs. " + totalAmount.toFixed(2);

}



/* ==========================================
   INCREASE QUANTITY
========================================== */

function increaseQuantity(index){

    if(!cart[index]) return;


    cart[index].quantity =
        Number(cart[index].quantity) + 1;


    saveCart();

    showCart();

}



/* ==========================================
   DECREASE QUANTITY
========================================== */

function decreaseQuantity(index){

    if(!cart[index]) return;


    cart[index].quantity =
        Number(cart[index].quantity) - 1;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

    showCart();

}



/* ==========================================
   REMOVE ITEM
========================================== */

function removeItem(index){

    if(!cart[index]) return;


    const productName =
        cart[index].name;


    cart.splice(index,1);


    saveCart();

    showCart();


    showMessage(
        productName + " removed from cart"
    );

}



/* ==========================================
   CHECKOUT
========================================== */

function showCheckout(){

    if(cart.length === 0){

        alert(
            "Your cart is empty. Please add products first."
        );

        return;

    }


    const checkout =
        document.getElementById(
            "checkoutSection"
        );


    checkout.style.display = "block";


    checkout.scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

}



/* ==========================================
   WHATSAPP ORDER
========================================== */

function placeOrder(){

    if(cart.length === 0){

        alert(
            "Your cart is empty."
        );

        return;

    }


    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const location =
        document.getElementById(
            "customerLocation"
        ).value.trim();


    const address =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    const payment =
        document.getElementById(
            "paymentMethod"
        ).value;



    /* ======================================
       VALIDATION
    ====================================== */

    if(name === ""){

        alert(
            "Please enter your full name."
        );

        return;

    }


    if(phone === ""){

        alert(
            "Please enter your phone number."
        );

        return;

    }


    if(location === ""){

        alert(
            "Please enter your delivery location."
        );

        return;

    }


    if(address === ""){

        alert(
            "Please enter your delivery address."
        );

        return;

    }



    /* ======================================
       CREATE WHATSAPP MESSAGE
    ====================================== */

    let message =
        "🌿 DST RAWANA LANKA - NEW ORDER\n\n";


    message +=
        "👤 Customer: " +
        name +
        "\n";


    message +=
        "📞 Phone: " +
        phone +
        "\n";


    message +=
        "📍 Location: " +
        location +
        "\n";


    message +=
        "🏠 Address: " +
        address +
        "\n";


    message +=
        "💳 Payment: " +
        payment +
        "\n\n";


    message +=
        "🛒 ORDER ITEMS\n";


    message +=
        "-------------------------\n";


    let total = 0;


    cart.forEach(function(item){

        const quantity =
            Number(item.quantity) || 1;


        const price =
            Number(item.price) || 0;


        const itemTotal =
            quantity * price;


        total += itemTotal;


        message +=
            item.name +
            " x " +
            quantity +
            " = Rs. " +
            itemTotal.toFixed(2) +
            "\n";

    });


    message +=
        "-------------------------\n";


    message +=
        "💰 TOTAL: Rs. " +
        total.toFixed(2) +
        "\n\n";


    message +=
        "Thank you - DST RAWANA LANKA ❤️";



    /* ======================================
       WHATSAPP NUMBER
    ====================================== */

    const whatsappNumber =
        "94714881433";


    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );

}



/* ==========================================
   MESSAGE
========================================== */

function showMessage(text){

    const oldMessage =
        document.querySelector(".message");


    if(oldMessage){

        oldMessage.remove();

    }


    const messageBox =
        document.createElement("div");


    messageBox.className =
        "message";


    messageBox.textContent =
        "✓ " + text;


    document.body.appendChild(
        messageBox
    );


    setTimeout(function(){

        if(messageBox){

            messageBox.remove();

        }

    },2000);

}



/* ==========================================
   START CART
========================================== */

loadCart();

showCart();

</script>


</body>

</html>
